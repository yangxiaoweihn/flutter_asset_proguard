builders:
  assets_proguard_builder:
    import: "package:flutter_asset_proguard/builder.dart"
    builder_factories: [ "assetsProguardBuilder" ]
    # 只是用来触发builder
    build_extensions: { "pubspec.yaml": [ ".dart_tool/generated/.asset_proguard_trigger_cache.dart" ] }
    auto_apply: none # dependents
    build_to: cache # source

    applies_builders: [ "source_gen|combining_builder" ]